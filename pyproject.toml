[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jades-eval"
version = "0.1.3"
description = "JADES decompositional response evaluation with configurable OpenAI-compatible models and usage tracking"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "TrustAIRLab"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "openai>=2.33,<3", "pydantic>=2.12,<3", "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1", "numpy>=1.26,<3", "nltk==3.9.1",
  "sentence-transformers==5.4.1", "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/TrustAIRLab/JADES_Eval"
Repository = "https://github.com/TrustAIRLab/JADES_Eval"
Issues = "https://github.com/TrustAIRLab/JADES_Eval/issues"
Documentation = "https://github.com/TrustAIRLab/JADES_Eval#readme"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "wheel>=0.45"]

[project.scripts]
jades = "jades.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jades = ["py.typed", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
